[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-brain"
version = "0.1.0"
description = "内网工作任务与 Codex 会话集中管理服务"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.162,<1",
  "filelock>=3.20,<4",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.54,<1",
  "wsproto>=1.3,<2",
]

[project.scripts]
super-brain = "super_brain.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.14", "playwright>=1.56"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: 实际 Codex / SSH 集成测试", "browser: 浏览器端到端测试", "live: 需要明确预算的真实模型测试"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# RPC 方法显式携带请求时限，内部统一使用 asyncio.wait_for / timeout。
ignore = ["E501", "ASYNC109"]

[tool.hatch.build.targets.wheel]
packages = ["src/super_brain"]

[tool.hatch.build]
artifacts = ["src/super_brain/static/**"]
